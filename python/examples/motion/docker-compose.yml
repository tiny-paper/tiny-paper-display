# Room motion on a TRMNL X (USB) from MQTT. On the Pi:  docker compose up -d
# Demo with fake rooms:  docker compose --profile demo up
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"        # the ESPectre sensors connect here; keep it on the home network
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  motion-display:
    build:
      context: ../../..
      dockerfile: python/examples/motion/Dockerfile
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      TZ: Europe/Brussels  # the clock and "today" follow this; set your own

  simulator:
    profiles: ["demo"]
    build:
      context: ../../..
      dockerfile: python/examples/motion/Dockerfile
    command: ["python", "-u", "simulator.py"]
    restart: unless-stopped
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
