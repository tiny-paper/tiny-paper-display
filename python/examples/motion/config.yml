# Rooms and broker. The topics and payloads here match the demo simulator; change them to what your ESPectre sensors
# publish (check with: mosquitto_sub -h <pi> -t '#' -v). Per room: name, topic (or a Home Assistant style
# state_topic), and either the default ON/OFF words, a JSON field ("a.b" for nested), or payload_on / payload_off.
mqtt:
  host: mosquitto
  port: 1883
  # user: pi
  # password: secret
rooms:
  - name: Living room
    topic: espectre/living/motion          # payload ON / OFF
  - name: Kitchen
    topic: espectre/kitchen/motion
    field: motion                          # payload {"motion": true, ...}
  - name: Bedroom
    topic: espectre/bedroom/motion         # payload true / false
    # payload_on: [detected]               # extra words that mean motion
    # payload_off: [clear]
