[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-paper-display"
version = "0.1.0"
description = "Show pictures on a tiny-paper display over its USB cable"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
bluetooth = ["bleak>=0.22"]
images = ["pillow>=10"]
test = ["pytest>=8,<10"]

[project.scripts]
tiny-paper-display = "tiny_paper_display.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
