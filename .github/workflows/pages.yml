# The GitHub Pages site, both branches in one deployment: main's site/ at the root, testing's site/ under testing/ with
# a visible "testing" label on every page. The files of the published releases are copied next to each site (fw/<tag>/),
# because a browser cannot read release downloads from another origin: the main page lists releases, the testing page
# pre-releases and releases (site/publish.mjs, site/test/publish.test.mjs). Runs on a change of site/ on either branch,
# after a release (build.yml passes its tag: the deploy waits for that release and fails if it or its files are
# missing, it never publishes the old list), and by hand. Publishes only when Pages is switched on for the repository
# (source: GitHub Actions). The environment github-pages must allow the branches main and testing and the tags v* and t*.
name: pages
on:
  workflow_call:
    inputs:
      tag:
        description: 'the release this deploy follows (must be listed and complete)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'a release that must be listed and complete (empty: none)'
        type: string
        required: false
        default: ''
  push:
    branches: [main, testing]
    paths: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4   # this ref: the scripts and the workflow
      - uses: actions/checkout@v4
        with: { ref: main, path: main-src }
      - uses: actions/checkout@v4
        with: { ref: testing, path: testing-src }
      - name: Site and the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # a release that was just created may not be listed yet: wait for it, then fail loudly
          ok=0
          for i in $(seq 1 20); do
            gh release list --exclude-drafts --limit 100 --json tagName,publishedAt,isPrerelease,isDraft > all.json
            if [ -z "$TAG" ] || node -e 'const t=process.argv[1];process.exit(JSON.parse(require("fs").readFileSync("all.json","utf8")).some(r=>r.tagName===t)?0:1)' "$TAG"; then ok=1; break; fi
            echo "release $TAG is not listed yet ($i of 20)"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::release $TAG never appeared: the site is not published"; exit 1; }
          # a v* tag is a release (both pages list it); a t* tag is a test build (the testing page only)
          main_tag=""; case "$TAG" in v*) main_tag="$TAG";; esac
          publish() { # <site dir> <out dir> <main|testing> <required tag>
            tags=$(node site/publish.mjs "$1" "$2" "$3" all.json "$4")
            for tag in $tags; do
              gh release download "$tag" --dir "$2/fw/$tag"
            done
            if [ -n "$4" ]; then
              for f in trmnl_x__flash.txt; do
                [ -s "$2/fw/$4/$f" ] || { echo "::error::$4 has no $f: the site is not published"; exit 1; }
              done
            fi
            cat "$2/fw/releases.json"
          }
          mkdir -p _site/testing
          publish main-src/site _site main "$main_tag"
          publish testing-src/site _site/testing testing "$TAG"
          # which run made this site: the live site can then be asked whether it is this deployment (verify below)
          printf '{"run":"%s","attempt":"%s","sha":"%s","ref":"%s","event":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" | tee _site/build.json > _site/testing/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # A deployment can report success and not be applied (seen on 2026-10-08: the artifact held the release, the live site
      # did not, files of one deployment came from two versions; the same sha deployed again a minute later was applied).
      # So the live site is asked whether it is THIS run, and when it is not the same artifact is deployed again, twice at most.
      - name: The live site is this deployment and shows the release
        id: verify1
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TAG: ${{ inputs.tag }}
        run: node site/publish.mjs verify "$PAGE_URL" "$TAG" "$GITHUB_RUN_ID" 6
      - name: Deploy again (the first deployment was not applied)
        id: deployment2
        if: steps.verify1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: The live site is this deployment (second try)
        id: verify2
        if: steps.verify1.outcome == 'failure'
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TAG: ${{ inputs.tag }}
        run: node site/publish.mjs verify "$PAGE_URL" "$TAG" "$GITHUB_RUN_ID" 6
      - name: Deploy again (the second deployment was not applied either)
        id: deployment3
        if: steps.verify1.outcome == 'failure' && steps.verify2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: The live site is this deployment (last try, fails the job)
        if: steps.verify1.outcome == 'failure' && steps.verify2.outcome == 'failure'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TAG: ${{ inputs.tag }}
        run: node site/publish.mjs verify "$PAGE_URL" "$TAG" "$GITHUB_RUN_ID" 12
