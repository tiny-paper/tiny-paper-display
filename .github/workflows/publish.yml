# PyPI project tiny-paper-display, publisher tiny-paper/tiny-paper-display, publish.yml, environment pypi.
name: publish
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'tiny-paper/tiny-paper-display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse a mismatched version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python python/check_version.py "$RELEASE_TAG"
      - run: python -m pip install build twine
      - name: Build and check both distributions
        run: |
          python -m build python --outdir dist
          python -m twine check dist/*
          python -m venv build/wheel-check
          build/wheel-check/bin/pip install dist/*.whl
          build/wheel-check/bin/tiny-paper-display --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      # Official PyPA action, release/v1 resolved 2026-10-07.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
